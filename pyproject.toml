[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckforge"
version = "0.1.0"
description = "DeckForge - human-looking PowerPoint decks learned from real decks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DeckForge" }]
keywords = ["powerpoint", "pptx", "presentation", "design", "pack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "python-pptx>=1.0.2",
    "XlsxWriter>=3.2.0",
    "pydantic>=2.9,<3",
    "typer>=0.12",
    "rich>=13.7",
    "lxml>=5.3",
    "Pillow>=11.0",
    "requests>=2.32",
    "keyring>=25.2",
    "platformdirs>=4.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
google = ["google-generativeai>=0.7"]
gui = ["PySide6>=6.7"]
vector = ["chromadb>=0.5"]
win = ["pywin32>=308; platform_system == 'Windows'"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
deckforge = "deckforge_core.cli.app:main"
deckforge-gui = "deckforge_core.gui.main:main"

[tool.setuptools.packages.find]
include = ["deckforge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]